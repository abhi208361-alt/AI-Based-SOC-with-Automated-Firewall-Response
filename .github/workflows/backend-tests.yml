name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip

          if [ ! -f backend/requirements.txt ]; then
            echo "backend/requirements.txt not found" >&2
            exit 1
          fi

          pip install -r backend/requirements.txt
          pip install pytest

          # Sanity check: fail fast if required imports aren't available
          python -c "import httpx; import pymongo; print('httpx ok', httpx.__version__); print('pymongo ok', pymongo.__version__)"

      - name: Run tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest -q